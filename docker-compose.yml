version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: incidentdb
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incidentpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
volumes:
  pgdata:
