spring.application.name=IncidentInvestigator
incident-analyzer.base-url=http://localhost:8000
incident-analyzer.connect-timeout=2s
incident-analyzer.read-timeout=5s
incident-analyzer.retry.max-attempts=2
incident-analyzer.retry.backoff=100ms
management.endpoints.web.exposure.include=health,metrics

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
analysis.kafka.requested-topic=incident.analysis.requested.v1
analysis.kafka.completed-topic=incident.analysis.completed.v1
analysis.kafka.failed-topic=incident.analysis.failed.v1


spring.datasource.url=jdbc:postgresql://localhost:5432/incidentdb
spring.datasource.username=incident
spring.datasource.password=incidentpass
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
