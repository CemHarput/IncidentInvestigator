spring.application.name=incident-investigator
incident-analyzer.base-url=http://localhost:8000
incident-analyzer.connect-timeout=2s
incident-analyzer.read-timeout=5s
incident-analyzer.retry.max-attempts=2
incident-analyzer.retry.backoff=100ms
management.endpoints.web.exposure.include=health,metrics

management.opentelemetry.resource-attributes.service.name=${OTEL_SERVICE_NAME:incident-investigator}
management.opentelemetry.resource-attributes.service.version=${OTEL_SERVICE_VERSION:v5}
management.opentelemetry.resource-attributes.deployment.environment=${OTEL_DEPLOYMENT_ENVIRONMENT:local}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:1.0}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.step=${OTEL_METRIC_EXPORT_INTERVAL:15s}
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
logging.pattern.correlation=[traceId=%X{traceId:-} spanId=%X{spanId:-} executionId=%X{executionId:-} incidentId=%X{incidentId:-}]\u0020

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
analysis.kafka.requested-topic=incident.analysis.requested.v1
analysis.kafka.completed-topic=incident.analysis.completed.v1
analysis.kafka.failed-topic=incident.analysis.failed.v1
analysis.kafka.publish-timeout=5s
analysis.kafka.result-consumer-group=incident-investigator-analysis-results-v1
analysis.kafka.consumer.max-attempts=3
analysis.kafka.consumer.retry-backoff=500ms

agents.incident-root-cause-agent.version=1.0
agents.incident-root-cause-agent.capabilities[0]=log-analyzer
agents.incident-root-cause-agent.capabilities[1]=metric-analyzer
agents.incident-root-cause-agent.capabilities[2]=trace-analyzer
agents.incident-root-cause-agent.limits.max-steps=10
agents.incident-root-cause-agent.limits.timeout=60s
agent.kafka.requested-topic=agent.execution.requested.v1
agent.kafka.publish-timeout=5s
agent.kafka.events-topic=${AGENT_EVENTS_TOPIC:agent.execution.events.v1}
agent.kafka.result-consumer-group=incident-investigator-agent-results-v1


spring.datasource.url=jdbc:postgresql://localhost:5432/incidentdb
spring.datasource.username=incident
spring.datasource.password=incidentpass
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
